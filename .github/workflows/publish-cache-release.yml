name: Publish single ZIP card-cache release
on:
  push:
    paths:
      - .github/workflows/publish-cache-release.yml
permissions:
  contents: write
concurrency:
  group: ilex-single-zip-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.5.0-build-2026-10-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Download and verify uploaded release build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ilex-cache-release"
          gh release download "$RELEASE_TAG" --pattern ILEX.GG-Windows-Small.zip --dir "$RUNNER_TEMP/ilex-cache-release"
          python3 verification/sync-cache-release.py
      - name: Verify cache and reproduce rules engine
        run: |
          set -euo pipefail
          node work/desktop-build/card-cache-tests.cjs
          npm ci --prefix work/desktop-build --ignore-scripts
          node work/desktop-build/build-rules.cjs
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('work/desktop/card-effect-sources/ex-source-manifest.json').read_text())
          assert hashlib.sha256(Path('work/desktop/ui/rules-engine.js').read_bytes()).hexdigest()==m['engineSha256'],'Engine rebuild mismatch'
          print('Rebuilt engine matches released bundle exactly.')
          PY
      - name: Commit matching source and align automatic source archives
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-cache-release.yml
          git add -A -- work/desktop work/rules-research/twinleafgg-main/ptcg-server/src verification work/desktop-build/package-ex.py work/desktop-build/card-cache-tests.cjs README.md
          python3 - <<'PY'
          import subprocess,json,hashlib
          from pathlib import Path
          p=Path('verification/source-manifest-1.5.0.json')
          m=json.loads(p.read_text())
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          m['files']={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in sorted(paths) if n and n!=str(p)}
          m['rulesEngineSha256']=hashlib.sha256(Path('work/desktop/ui/rules-engine.js').read_bytes()).hexdigest()
          m['distribution']='single ZIP with downloadable card image cache'
          m['releaseZipSha256']='784ebcc894925fa2e23911f04a9ca0749f2bf035a048ba14c82ccf1d079d2949'
          p.write_text(json.dumps(m,indent=2)+'\n')
          print('Recorded',len(m['files']),'matching source files.')
          PY
          git add verification/source-manifest-1.5.0.json
          git commit -m "Synchronize source with single ZIP card-cache release"
          git push origin HEAD:main
          tag_ref="refs/tags/$RELEASE_TAG"
          old_ref=$(git ls-remote origin "$tag_ref" | cut -f1)
          test "$(git rev-parse "$tag_ref^{commit}")" = "b1e007874797cc6c18f41d82c1093681d6ada29c"
          git tag --force "$RELEASE_TAG" HEAD
          git push --force-with-lease="$tag_ref:$old_ref" origin "$tag_ref"
      - name: Publish current checksums and single-file instructions
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/ilex-cache-release/SHA256SUMS.txt" "$RUNNER_TEMP/ilex-cache-release/desktop-verification.json" verification/card-cache-release-1.5.0.json --clobber
          gh release edit "$RELEASE_TAG" --notes-file verification/release-notes-1.5.0.md
          for asset in ILEX.GG-Windows.zip.001 ILEX.GG-Windows.zip.002 Restore-ILEX-ZIP.cmd; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done
          gh release view "$RELEASE_TAG" --json assets,tagName,url
