name: Synchronize verified alternate modes3.1.0 source
on:
  push:
    paths:
      - .github/workflows/sync-v31-3.1.0.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and verify authorized source transfer from release draft
        shell: python
        run: |
          from pathlib import Path
          import json,subprocess,hashlib,os,zipfile
          repo='repos/KenGuyGames/ILEX.GG'
          releases=json.loads(subprocess.check_output(['gh','api',repo+'/releases']))
          matches=[r for r in releases if r['draft'] and r['name']=='ILEX.GG 3.1.0 — New Rule & Ken Guy Rules']
          assert len(matches)==1,'Expected one alternate modes3.1.0 draft'
          assets=[a for a in matches[0]['assets'] if a['name']=='ILEX.GG-source-3.1.0-transfer.zip']
          assert len(assets)==1,'Expected one frozen source transfer'
          asset=assets[0]
          file=Path(os.environ['RUNNER_TEMP'])/'campaign-source.zip'
          with file.open('wb') as fp:subprocess.run(['gh','api',repo+'/releases/assets/'+str(asset['id']),'-H','Accept: application/octet-stream'],stdout=fp,check=True)
          assert hashlib.sha256(file.read_bytes()).hexdigest()=='a9b58f245160932c02844554f500c8c9075c9cf4ff23db35e7d0be4e250610ca','Source transfer hash mismatch'
          root=Path.cwd().resolve()
          with zipfile.ZipFile(file) as z:
              for e in z.infolist():
                  p=(root/e.filename).resolve()
                  assert p.is_relative_to(root) and '.git' not in p.relative_to(root).parts
              z.extractall(root)
          m=json.loads(Path('verification/source-manifest-3.1.0.json').read_text());files=m['files']
          managed=('work/desktop/','work/desktop-build/','work/cube-source/','work/android-build/','work/campaign-release/','work/new-rule-audit/','work/pocket-research/','docs/screenshots/','verification/')
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if name and name.startswith(managed) and name not in files:Path(name).unlink(missing_ok=True)
          for name,h in files.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          assert json.loads(Path('work/desktop/package.json').read_text())['version']=='3.1.0'
          Path(os.environ['RUNNER_TEMP']+'/transfer-asset-id').write_text(str(asset['id']))
          print('Verified',len(files),'alternate modes3.1.0 source files')
      - name: Install locked build tools and rebuild exact engine
        run: |
          npm ci --prefix work/desktop-build
          npm run build:rules
      - name: Verify reproducible source and stage intentional source archives
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess
          m=json.loads(Path('verification/source-manifest-3.1.0.json').read_text())
          for name,h in m['files'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          for name in m['files']:
              if name.endswith('.zip'):subprocess.run(['git','add','-f','--',name],check=True)
          print('All frozen source bytes and rebuilt engine match')
      - name: Commit current source and create new3.1.0 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git rm .github/workflows/sync-v31-3.1.0.yml
          git add -A
          git commit -m "Release ILEX.GG3.1.0 alternate modes source and README;Pocket removed"
          git push origin HEAD:main
          test -z "$(git ls-remote origin refs/tags/v3.1.0-build-2026-10-27)"
          git tag v3.1.0-build-2026-10-27
          git push origin refs/tags/v3.1.0-build-2026-10-27
      - name: Remove only the completed temporary source transfer asset
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess
          asset=Path(os.environ['RUNNER_TEMP']+'/transfer-asset-id').read_text().strip()
          assert asset.isdigit()
          subprocess.run(['gh','api','--method','DELETE','repos/KenGuyGames/ILEX.GG/releases/assets/'+asset],check=True)

