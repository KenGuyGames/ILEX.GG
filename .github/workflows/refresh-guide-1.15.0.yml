name: Refresh 1.15.0 Android installation guide
on:
  push:
    paths:
      - .github/workflows/refresh-guide-1.15.0.yml
permissions:
  contents: write
jobs:
  guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.15.0-build-2026-10-18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify source and refresh guide manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,base64,os
          p=Path("verification/source-manifest-1.15.0.json");m=json.loads(p.read_text())
          for n,h in m["files"].items():
              assert hashlib.sha256(Path(n).read_bytes()).hexdigest()==h,n
          name="verification/ILEX.GG-Android-Install.md"
          content=base64.b64decode("")
          Path(name).write_bytes(content)
          m["files"][name]=hashlib.sha256(content).hexdigest()
          p.write_text(json.dumps(m,indent=2)+"\n")
          Path(os.environ["RUNNER_TEMP"],"SHA256SUMS.txt").write_bytes(base64.b64decode(""))
      - name: Align unpublished release source and draft documentation
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true"
          previous=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git rm .github/workflows/refresh-guide-1.15.0.yml
          git add verification/ILEX.GG-Android-Install.md verification/source-manifest-1.15.0.json
          git commit -m "Refresh 1.15.0 Android installation guide and source manifest"
          git push origin HEAD:main
          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" "--force-with-lease=refs/tags/$TAG:$previous"
          gh release upload "$TAG" verification/ILEX.GG-Android-Install.md "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
      - name: Verify fresh ZIP and tar.gz source hashes
        shell: python
        run: |
          import urllib.request,zipfile,tarfile,json,hashlib
          from pathlib import Path
          base="https://github.com/KenGuyGames/ILEX.GG/archive/refs/tags/v1.15.0-build-2026-10-18"
          for ext in ["zip","tar.gz"]:
              p=Path("source."+ext)
              urllib.request.urlretrieve(base+"."+ext,p)
              if ext=="zip":
                  a=zipfile.ZipFile(p);names=a.namelist();read=a.read
              else:
                  a=tarfile.open(p);names=a.getnames();read=lambda n:a.extractfile(n).read()
              suffix="verification/source-manifest-1.15.0.json"
              prefix=next(n for n in names if n.endswith("/"+suffix)).removesuffix(suffix)
              m=json.loads(read(prefix+suffix))
              for name,expected in m["files"].items():
                  assert hashlib.sha256(read(prefix+name)).hexdigest()==expected,(ext,name)
              print(f"PASS {ext}: {len(m['files'])} source hashes match")
              a.close()
