name: Sync ILEX.GG 3.5.0 source downloads
on:
  push:
    branches: [release/3.5.0]
    paths: [.github/workflows/sync-source-3.5.0.yml]
permissions:
  contents: read
env:
  TAG: v3.5.0-build-2026-11-02
  OLD_TAG_SHA: ff869f1f879e7879edf82b809361278f6e4c0daa
  WINDOWS_SHA: d9bc1c83a2c787a1e8a9761b9ec1b6028624e7bfcd0e4ffd28e9a2d1ebda8b81
  ENGINE_SHA: a53538ead49318f438bbca80d2d2d2122e99acb36567356619e4e3d8a1816c77
jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify published Windows ZIP and copy runtime sources
        run: |
          curl --fail --location --retry 3 "https://github.com/KenGuyGames/ILEX.GG/releases/download/$TAG/ILEX.GG-Windows.zip" -o "$RUNNER_TEMP/windows.zip"
          echo "$WINDOWS_SHA  $RUNNER_TEMP/windows.zip" | sha256sum --check
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, zipfile
          root = Path('work/desktop')
          prefix = 'ILEX.GG-win32-x64/resources/app/'
          files = {}
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'windows.zip') as archive:
              for member in archive.infolist():
                  if member.is_dir() or not member.filename.startswith(prefix):
                      continue
                  name = member.filename.removeprefix(prefix)
                  if not name.startswith('ui/') and name not in {'main.cjs','preload.cjs','card-cache.cjs','cube-import.cjs','icon.ico','package.json'}:
                      continue
                  relative = PurePosixPath(name)
                  assert not relative.is_absolute() and '..' not in relative.parts
                  data = archive.read(member)
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  files[target.as_posix()] = hashlib.sha256(data).hexdigest()
          assert sum(n.startswith('work/desktop/ui/') for n in files) == 2283
          assert files['work/desktop/ui/rules-engine.js'] == os.environ['ENGINE_SHA']
          for target in (root / 'ui').rglob('*'):
              if target.is_file() and target.as_posix() not in files:
                  target.unlink()
          for name in ('package.json', 'package-lock.json'):
              path = Path(name)
              data = json.loads(path.read_text())
              data['version'] = '3.5.0'
              if name == 'package-lock.json':
                  data['packages']['']['version'] = '3.5.0'
              else:
                  data['scripts']['test:delta-reign'] = 'node work/desktop-build/delta-reign-tests.cjs'
              path.write_text(json.dumps(data, indent=2) + '\n')
          manifest = {'version':'3.5.0','windowsZipSha256':os.environ['WINDOWS_SHA'],'rulesEngineSha256':os.environ['ENGINE_SHA'],'files':files}
          Path('verification/source-manifest-3.5.0.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Apply the matching engine source and document the release
        run: |
          cat > work/cube-source/src/sets/08-sun-and-moon/set-unbroken-bonds/beast-bringer.ts <<'SOURCE'
          // This file was auto-generated by the card stub generator.
          // Card effects were implemented by an agent.
          // If you have any questions or feedback, reach out to @C4 in the discord.
          
          import { TrainerCard } from '../../../game/store/card/trainer-card';
          import { TrainerType, CardTag } from '../../../game/store/card/card-types';
          import { StoreLike, State, StateUtils } from '../../../game';
          import { Effect } from '../../../game/store/effects/effect';
          import { KnockOutEffect } from '../../../game/store/effects/game-effects';
          import { IS_TOOL_BLOCKED } from '../../../game/store/prefabs/prefabs';
          
          export class BeastBringer extends TrainerCard {
            protected _trainerType: TrainerType = TrainerType.TOOL;
            public set: string = 'UNB';
            public setNumber: string = '164';
            public cardImage: string = 'assets/cardback.png';
            public name: string = 'Beast Bringer';
            public fullName: string = 'Beast Bringer UNB';
            public text: string =
              "If you have exactly 6 Prize cards remaining, and if your opponent's Active Pokémon-GX or Pokémon-EX is Knocked Out by damage from an attack of the Ultra Beast this card is attached to, take 1 more Prize card.";
          
            // Ref: set-team-up/black-market.ts (Black Market - KnockOutEffect prize modification)
            public reduceEffect(store: StoreLike, state: State, effect: Effect): State {
              if (effect instanceof KnockOutEffect) {
                // Find which Pokemon this tool is attached to
                const attachedTo = StateUtils.findPokemonSlot(state, this);
                if (!attachedTo || !attachedTo.tools || !attachedTo.tools.includes(this)) {
                  return state;
                }
          
                const toolOwner = StateUtils.findOwner(state, attachedTo);
          
                if (IS_TOOL_BLOCKED(store, state, toolOwner, this)) {
                  return state;
                }
          
                // Check if tool owner has exactly 6 prize cards remaining
                const prizeCount = toolOwner.prizes.filter((p) => p.cards.length > 0).length;
                if (prizeCount !== 6) {
                  return state;
                }
          
                // Check if the attached Pokemon is an Ultra Beast
                const attachedPokemon = attachedTo.getPokemonCard();
                if (!attachedPokemon || !attachedPokemon.hasTag(CardTag.ULTRA_BEAST)) {
                  return state;
                }
          
                // Check if the KO target is opponent's active GX or EX
                const targetCard = effect.target.getPokemonCard();
                if (!targetCard) {
                  return state;
                }
          
                if (!targetCard.hasTag(CardTag.POKEMON_GX) && !targetCard.hasTag(CardTag.POKEMON_EX)) {
                  return state;
                }
          
                // Check that the KO target belongs to the opponent
                const targetOwner = StateUtils.findOwner(state, effect.target);
                if (targetOwner === toolOwner) {
                  return state;
                }
          
                // Check that the target is the active Pokemon
                if (effect.target !== targetOwner.active) {
                  return state;
                }
          
                // The bonus belongs only to damage from this holder's own attack.
                const lethal = (effect.target as any)._exLethalAttackDamage;
                if (lethal?.turn !== state.turn || lethal.card !== targetCard ||
                  lethal.attackerCard !== attachedPokemon) return state;
          
                effect.prizeCount += 1;
              }
          
              return state;
            }
          }
          SOURCE
          cat > work/desktop-build/delta-reign-tests.cjs <<'SOURCE'
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const ui = path.resolve(process.argv[2] || 'work/desktop/ui');
          const json = name => JSON.parse(fs.readFileSync(path.join(ui, name + '.json')));
          const cards = json('cards');
          const details = json('card-details');
          const mapping = json('rules-card-map');
          const packModel = require(path.join(ui, 'pack-model.js'));
          const profiles = packModel.build(cards, json('sets'), details);
          const delta = profiles.find(profile => profile.id === 'me06');
          assert.deepEqual(delta.rareOdds, profiles.find(profile => profile.id === 'me05').rareOdds);
          const setCards = cards.filter(card => card.id.startsWith('me06-'));
          assert.equal(setCards.length, 141);
          for (const card of setCards) {
            if (!card.scan.startsWith('https:')) assert(fs.existsSync(path.join(ui, card.scan)));
          }
          const pairHits = new Set();
          for (let i = 0; i < 10000; i++) {
            const pack = packModel.generate(delta);
            assert.equal(pack.length, 11);
            assert.equal(pack.filter(card => card.slot === 'Uncommon').length, 3);
            const halves = pack.filter(card => details[card.id]?.dualStadium);
            if (halves.length) {
              assert.equal(halves.length, 2);
              assert.equal(details[halves[0].id].dualStadium, details[halves[1].id].dualStadium);
              assert.equal(details[halves[0].id].dualStadiumHalf, 'left');
              assert.equal(details[halves[1].id].dualStadiumHalf, 'right');
              assert(halves.every(card => card.tier === 'uncommon' && card.finish === 'normal'));
              pairHits.add(halves[0].id);
            }
            assert.equal(pack.find(card => card.slot === 'Rare slot').finish, 'holo');
          }
          assert.equal(pairHits.size, 3);
          const context = {};
          const bundle = fs.readFileSync(path.join(ui, 'rules-engine.js'), 'utf8');
          vm.runInNewContext(bundle.replace(
            'return __toCommonJS(tcg_lab_entry_exports);',
            'return {setDeltaReign, canPlayDualStadium, assembleDualStadiumFromHand, StateUtils};'
          ), context);
          const {setDeltaReign, canPlayDualStadium, assembleDualStadiumFromHand, StateUtils} = context.TCGRules;
          function pile(...cards) {
            return {cards, moveTo(target){target.cards.push(...this.cards.splice(0));},
              moveCardTo(card,target){target.cards.push(...this.cards.splice(this.cards.indexOf(card),1));}};
          }
          for (const [leftId,rightId] of delta.dualPairs) {
            const left = setDeltaReign.find(card => card.fullName === mapping[leftId]);
            const right = setDeltaReign.find(card => card.fullName === mapping[rightId]);
            assert(left && right && left.name === right.name);
            assert(left.tags.includes('Dual Stadium') && right.tags.includes('Dual Stadium'));
            const player = {id:1,hand:pile(left,left),stadium:pile(),discard:pile()};
            const previous = {name:'Previous Stadium'};
            const opponent = {id:2,stadium:pile(previous),discard:pile()};
            const state = {phase:2,turn:4,activePlayer:0,players:[player,opponent]};
            const store = {log(){}};
            assert.equal(canPlayDualStadium(store,state,player,left), false);
            player.hand.cards.push(right);
            assert.equal(canPlayDualStadium(store,state,player,right), true);
            assembleDualStadiumFromHand(store,state,player,right);
            assert.deepEqual(player.stadium.cards,[left,right]);
            assert.deepEqual(opponent.discard.cards,[previous]);
            assert.equal(StateUtils.getStadiumCard(state),left);
            assert.equal(player.stadiumPlayedTurn,4);
            assert.equal(canPlayDualStadium(store,state,player,left),false);
          }
          console.log('141 entries, 10,000 packs, all three Stadium pairs, scan paths and holo slots passed');
          SOURCE
          cat > README.md <<'SOURCE'
          # ILEX.GG 3.5.0 for Windows
          
          This source snapshot includes **Echoes of Tomorrow** and **Delta Reign**. Finish **The Fractured Hour** to unlock the new campaign. Delta Reign adds 141 catalog entries, a pack profile, and three paired Stadiums.
          
          Use PowerShell in the extracted source folder on Windows 10 or 11 x64 with Node.js 24 and npm.
          
          ```powershell
          npm install
          npm start
          ```
          
          The included rules engine matches the Windows release. To rebuild it and run the Delta Reign regression check:
          
          ```powershell
          npm ci --prefix work/desktop-build
          npm run build:rules
          npm run test:delta-reign
          ```
          
          The packaged Windows ZIP and checksums are available on the [3.5.0 release page](https://github.com/KenGuyGames/ILEX.GG/releases/tag/v3.5.0-build-2026-11-02). The source manifest records the Windows ZIP hash and the matching desktop files.
          SOURCE
          npm ci --prefix work/desktop-build
          npm run build:rules
          echo "$ENGINE_SHA  work/desktop/ui/rules-engine.js" | sha256sum --check
          npm run test:delta-reign
      - name: Commit the verified source snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git rm .github/workflows/sync-source-3.5.0.yml
          git add README.md package.json package-lock.json verification/source-manifest-3.5.0.json work/cube-source work/desktop-build/delta-reign-tests.cjs
          git add -f work/desktop/ui work/desktop/package.json work/desktop/main.cjs work/desktop/preload.cjs work/desktop/card-cache.cjs work/desktop/cube-import.cjs work/desktop/icon.ico
          git commit -m "Match ILEX.GG 3.5.0 source to the published Windows build"
          git push origin HEAD:refs/heads/release/3.5.0
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  windows:
    needs: source
    runs-on: windows-2025
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and launch from a fresh source download
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
        run: |
          Invoke-WebRequest "https://codeload.github.com/KenGuyGames/ILEX.GG/zip/$env:SOURCE_SHA" -OutFile "$env:RUNNER_TEMP/source.zip"
          tar -xf "$env:RUNNER_TEMP/source.zip" -C "$env:RUNNER_TEMP"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location "$env:RUNNER_TEMP/ILEX.GG-$env:SOURCE_SHA"
          npm install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:delta-reign
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sourcePath = (Get-Location).Path
          $launcher = Start-Process -FilePath $env:ComSpec -ArgumentList '/d /s /c "npm start"' -WorkingDirectory $sourcePath -WindowStyle Hidden -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/start-out.txt" -RedirectStandardError "$env:RUNNER_TEMP/start-err.txt"
          $deadline = (Get-Date).AddSeconds(120)
          do {
            $window = Get-Process electron -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$sourcePath*" -and $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -like '*ILEX.GG*' } | Select-Object -First 1
            if ($window -or $launcher.HasExited) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if (!$window -or !$window.Responding) { Get-Content "$env:RUNNER_TEMP/start-err.txt"; throw 'Fresh source did not open a responding ILEX.GG window' }
          $null = $window.CloseMainWindow()
          if (!$launcher.WaitForExit(15000) -or $launcher.ExitCode -ne 0) { throw 'Fresh source did not shut down cleanly' }
          Write-Output 'PASS: npm install, Delta Reign checks, normal npm start and clean shutdown'
  release:
    needs: [source, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - name: Update only the 3.5.0 source tag with its expected old value
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git push --force-with-lease="refs/tags/$TAG:$OLD_TAG_SHA" origin "$SOURCE_SHA:refs/tags/$TAG"
      - name: Verify both automatic source archives against the Windows manifest
        run: |
          curl --fail --location --retry 3 "https://codeload.github.com/KenGuyGames/ILEX.GG/zip/refs/tags/$TAG" -o "$RUNNER_TEMP/source.zip"
          curl --fail --location --retry 3 "https://codeload.github.com/KenGuyGames/ILEX.GG/tar.gz/refs/tags/$TAG" -o "$RUNNER_TEMP/source.tar.gz"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, tarfile, zipfile
          expected = json.loads(Path('verification/source-manifest-3.5.0.json').read_text())['files']
          temp = Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(temp / 'source.zip') as archive:
              seen = set()
              for entry in archive.infolist():
                  name = entry.filename.partition('/')[2]
                  if name in expected:
                      assert hashlib.sha256(archive.read(entry)).hexdigest() == expected[name], name
                      seen.add(name)
              assert seen == set(expected), set(expected) - seen
          with tarfile.open(temp / 'source.tar.gz', 'r|gz') as archive:
              seen = set()
              for entry in archive:
                  name = entry.name.partition('/')[2]
                  if name in expected:
                      assert hashlib.file_digest(archive.extractfile(entry), 'sha256').hexdigest() == expected[name], name
                      seen.add(name)
              assert seen == set(expected), set(expected) - seen
          print('Both release source archives match', len(expected), 'Windows runtime files')
          PY
