name: Refresh 1.5.0 source test fixtures
on:
  push:
    paths:
      - .github/workflows/refresh-test-fixtures.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Update fixture hashes
        shell: python
        run: |
          import hashlib,json
          from pathlib import Path
          p=Path("verification/source-manifest-1.5.0.json")
          m=json.loads(p.read_text())
          for name in ["base-fossil-audit.json","wotc-card-lengths.json","wotc-library-plan.json","wotc-automation-pending.json"]:
              f="work/rules-research/"+name
              m["files"][f]=hashlib.sha256(Path(f).read_bytes()).hexdigest()
          p.write_text(json.dumps(m,indent=2)+"\n")
      - name: Publish corrected source archive
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-test-fixtures.yml
          git add verification/source-manifest-1.5.0.json
          git commit -m "Include complete WOTC test fixtures in release source manifest"
          git push origin HEAD:main
          ref=refs/tags/v1.5.0-build-2026-10-14
          old=$(git ls-remote origin "$ref" | cut -f1)
          test "$old" = "442fbf3d22c2bd54d1be08a872402f0b58ee2ada"
          git tag -f v1.5.0-build-2026-10-14 HEAD
          git push --force-with-lease="$ref:$old" origin "$ref"
