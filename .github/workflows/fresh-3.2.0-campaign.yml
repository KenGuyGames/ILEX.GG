name: Fresh 3.2.0 download, Campaign progress and process restart
on:
  push:
    paths:
      - .github/workflows/fresh-3.2.0-campaign.yml
permissions:
  contents: read
jobs:
  readme:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh source ZIP from the release
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/KenGuyGames/ILEX.GG/archive/refs/tags/v3.2.0-build-2026-10-28.zip' -OutFile "$env:RUNNER_TEMP/source.zip"
          Expand-Archive "$env:RUNNER_TEMP/source.zip" "$env:RUNNER_TEMP/extracted"
          $download = Get-ChildItem "$env:RUNNER_TEMP/extracted" -Directory | Select-Object -First 1
          Move-Item -LiteralPath $download.FullName -Destination "$env:RUNNER_TEMP/source"
          node --version
          npm --version
          if (Test-Path "$env:RUNNER_TEMP/source/node_modules") { throw 'Download contains dependencies' }
          if (Test-Path "$env:RUNNER_TEMP/source/outputs/Pokemon-TCG-Lab/scans") { throw 'Download contains scans' }
          if (Test-Path "$env:APPDATA/TCG Lab") { throw 'Test profile is not fresh' }
      - name: README npm install
        working-directory: ${{ runner.temp }}/source
        run: npm install
      - name: First README npm start
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          $logPrefix = Join-Path $env:RUNNER_TEMP 'first-start'
          $launcher = Start-Process -FilePath $env:ComSpec -ArgumentList '/d /s /c "npm start"' -WorkingDirectory (Get-Location).Path -WindowStyle Hidden -PassThru -RedirectStandardOutput "$logPrefix-out.txt" -RedirectStandardError "$logPrefix-error.txt"
          $sourcePrefix = (Get-Location).Path
          $deadline = (Get-Date).AddSeconds(120)
          $window = $null
          while ((Get-Date) -lt $deadline) {
            $window = Get-Process electron -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$sourcePrefix*" -and $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -like '*ILEX.GG*' } | Select-Object -First 1
            if ($window) { break }
            if ($launcher.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (!$window) {
            Get-Content "$logPrefix-out.txt" -ErrorAction SilentlyContinue
            Get-Content "$logPrefix-error.txt" -ErrorAction SilentlyContinue
            throw 'npm start did not open the ILEX.GG window'
          }
          Start-Sleep -Seconds 12
          $window.Refresh()
          if ($window.HasExited) { throw 'The app exited during startup' }
          $cached = @(Get-ChildItem "$env:APPDATA/TCG Lab/card-cache" -Recurse -File -ErrorAction SilentlyContinue)
          Write-Output "PASS npm start: title=$($window.MainWindowTitle); responding=$($window.Responding); cacheFiles=$($cached.Count)"
          if (!$window.Responding) { throw 'App window is not responding' }
          if ($cached.Count -eq 0) { throw 'No artwork was cached from the fresh launch' }
          $null = $window.CloseMainWindow()
          if (!$launcher.WaitForExit(15000)) { throw 'npm start did not exit after closing the app' }
          Get-Content "$logPrefix-out.txt"
          $stderr = Get-Content "$logPrefix-error.txt" -Raw -ErrorAction SilentlyContinue
          if ($stderr -match 'Uncaught Exception|ReferenceError:|TypeError:') { throw $stderr }
          Write-Output "PASS normal window launch and close; npm exit $($launcher.ExitCode)"
          if ($launcher.ExitCode -ne 0) { throw 'npm start returned a nonzero exit code' }

      - name: README install locked build tools
        working-directory: ${{ runner.temp }}/source
        run: npm ci --prefix work/desktop-build
      - name: README rebuild engine
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          npm run build:rules
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $manifest = Get-Content verification/source-manifest-3.2.0.json -Raw | ConvertFrom-Json
          if ((Get-FileHash work/desktop/ui/rules-engine.js).Hash.ToLower() -ne $manifest.rulesEngineSha256) { throw 'Rebuilt engine hash mismatch' }
      - name: Rebuilt README npm start
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          $logPrefix = Join-Path $env:RUNNER_TEMP 'rebuilt-start'
          $launcher = Start-Process -FilePath $env:ComSpec -ArgumentList '/d /s /c "npm start"' -WorkingDirectory (Get-Location).Path -WindowStyle Hidden -PassThru -RedirectStandardOutput "$logPrefix-out.txt" -RedirectStandardError "$logPrefix-error.txt"
          $sourcePrefix = (Get-Location).Path
          $deadline = (Get-Date).AddSeconds(120)
          $window = $null
          while ((Get-Date) -lt $deadline) {
            $window = Get-Process electron -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$sourcePrefix*" -and $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -like '*ILEX.GG*' } | Select-Object -First 1
            if ($window) { break }
            if ($launcher.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (!$window) {
            Get-Content "$logPrefix-out.txt" -ErrorAction SilentlyContinue
            Get-Content "$logPrefix-error.txt" -ErrorAction SilentlyContinue
            throw 'npm start did not open the ILEX.GG window'
          }
          Start-Sleep -Seconds 12
          $window.Refresh()
          if ($window.HasExited) { throw 'The app exited during startup' }
          $cached = @(Get-ChildItem "$env:APPDATA/TCG Lab/card-cache" -Recurse -File -ErrorAction SilentlyContinue)
          Write-Output "PASS npm start: title=$($window.MainWindowTitle); responding=$($window.Responding); cacheFiles=$($cached.Count)"
          if (!$window.Responding) { throw 'App window is not responding' }
          if ($cached.Count -eq 0) { throw 'No artwork was cached from the fresh launch' }
          $null = $window.CloseMainWindow()
          if (!$launcher.WaitForExit(15000)) { throw 'npm start did not exit after closing the app' }
          Get-Content "$logPrefix-out.txt"
          $stderr = Get-Content "$logPrefix-error.txt" -Raw -ErrorAction SilentlyContinue
          if ($stderr -match 'Uncaught Exception|ReferenceError:|TypeError:') { throw $stderr }
          Write-Output "PASS normal window launch and close; npm exit $($launcher.ExitCode)"
          if ($launcher.ExitCode -ne 0) { throw 'npm start returned a nonzero exit code' }

      - name: README test commands in order
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          npm run test:campaign
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:energy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:effects
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:cube
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:cube-import
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:overeager
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:new-rule
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:ken-guy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:removal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:multiplayer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:protocol
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node work/desktop-build/card-cache-tests.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Expanded Campaign dialogue, reactions and exchange recovery
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          $electron = node -e "console.log(require('electron'))" | Select-Object -Last 1
          $env:ELECTRON_RUN_AS_NODE = $null
          $entry = (Resolve-Path work/campaign-release/native-dialogue.cjs).Path
          $report = "$env:RUNNER_TEMP/native-campaign-dialogue"
          $process = Start-Process -FilePath $electron -ArgumentList @($entry,$report) -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/campaign-out.txt" -RedirectStandardError "$env:RUNNER_TEMP/campaign-error.txt"
          Get-Content "$env:RUNNER_TEMP/campaign-out.txt"
          if ($process.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP/campaign-error.txt"; Get-Content "$report/failure.txt" -ErrorAction SilentlyContinue; throw 'Campaign native failure' }
          $result = Get-Content "$report/native-result.json" -Raw | ConvertFrom-Json
          if (!$result.passed) { throw 'Campaign dialogue check failed' }
          $result | ConvertTo-Json -Depth 7
      - name: Fresh and restored New Rule and Ken Guy native checks
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          $electron = node -e "console.log(require('electron'))" | Select-Object -Last 1
          $env:ELECTRON_RUN_AS_NODE = $null
          foreach ($mode in @('new-rule','ken')) {
            $report = "$env:RUNNER_TEMP/native-$mode"
            foreach ($launch in @('fresh','restored')) {
              $entry = (Resolve-Path work/new-rule-audit/native-entry.cjs).Path
              $process = Start-Process -FilePath $electron -ArgumentList @($entry,$report,$mode) -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/$mode-$launch-out.txt" -RedirectStandardError "$env:RUNNER_TEMP/$mode-$launch-error.txt"
              Get-Content "$env:RUNNER_TEMP/$mode-$launch-out.txt"
              if ($process.ExitCode -ne 0) {
                Get-Content "$env:RUNNER_TEMP/$mode-$launch-error.txt"
                if (Test-Path "$report/failure.txt") { Get-Content "$report/failure.txt" }
                throw "Native $mode $launch exited $($process.ExitCode)"
              }
              $result = Get-Content "$report/native-result.json" -Raw | ConvertFrom-Json
              if (!$result.passed -or !$result.pocketRemoved) { throw 'Native mode/removal check failed' }
              $result | ConvertTo-Json -Depth 7
            }
          }

      - name: Expanded dialogue and saved progress across complete process restarts
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          $entry = "$env:RUNNER_TEMP/campaign-process-restart.cjs"
          @'
          const fs=require('fs'),path=require('path'),assert=require('assert/strict');
          const root=path.resolve(process.argv[2]),dir=path.resolve(process.argv[3]),phase=process.argv[4],source=path.join(root,'work/desktop');
          fs.mkdirSync(dir,{recursive:true});process.argv.push('--self-test',dir);
          const self=path.join(source,'self-test.cjs');
          require.cache[self]={id:self,filename:self,loaded:true,exports:async win=>{
           const run=s=>win.webContents.executeJavaScript(s,true),checks=[],check=(v,n)=>{assert(v,n);checks.push(n)},wait=ms=>new Promise(r=>setTimeout(r,ms));
           for(let i=0;i<600;i++){if(await run("rulesReady&&typeof StoryMode!=='undefined'"))break;await wait(100);}
           await run('botSuspended=true;IlexAudio.update({muted:true});true');
           const snapshot=async name=>fs.writeFileSync(path.join(dir,name+'.json'),await run('JSON.stringify(state.storyCampaign)'));
           const exact=async name=>{const expected=JSON.parse(fs.readFileSync(path.join(dir,name+'.json'),'utf8')),actual=JSON.parse(await run('JSON.stringify(state.storyCampaign)'));assert.deepEqual(actual,expected);checks.push(name+' survives complete app exit/restart');};
           if(phase==='story-save'){
            await run("state.storyPresentation={speed:'instant',sounds:false};delete state.storyCampaign;StoryMode.menu();StoryMode.newGame();StoryMode.enterEra();while(state.storyCampaign.phase==='intro'&&state.storyCampaign.line<18)StoryMode.next();true");
            check(await run('document.body.textContent.includes("would the trees notice")'),'New expanded dialogue visible');await snapshot('story');
           }else if(phase==='story-restore'){
            await exact('story');await run('StoryMode.continueCampaign();true');check(await run('document.body.textContent.includes("would the trees notice")'),'Continue returns to expanded Celebi line');
            await run("while(state.storyCampaign.phase==='intro')StoryMode.next();StoryMode.choose('a');while(state.storyCampaign.line<IlexStoryContent.chapters[0].paths[0].missions[0].before.length-1)StoryMode.next();true");
            await run("(async()=>{await StoryMode.start();stopBotForUndo();for(let i=0;i<150&&RulesMatch.pending(rulesMatch).length;i++)RulesMatch.apply(rulesMatch,BotAI.prompt(rulesMatch,RulesMatch.pending(rulesMatch)[0],'normal'));saveRules();render();stopBotForUndo();save();})()");
            check(await run('!!state.storyCampaign.battle&&rulesMatch.store.state.phase===RulesMatch.R.GamePhase.PLAYER_TURN'),'Real campaign battle starts');await snapshot('battle');
            fs.writeFileSync(path.join(dir,'journal.json'),await run('JSON.stringify(rulesMatch.journal)'));
           }else if(phase==='battle-restore'){
            await exact('battle');await run('StoryMode.open();StoryMode.resume();stopBotForUndo();true');assert.deepEqual(JSON.parse(await run('JSON.stringify(rulesMatch.journal)')),JSON.parse(fs.readFileSync(path.join(dir,'journal.json'),'utf8')));checks.push('Active battle journal resumes exactly');
            await run('StoryMode.finish();true');check(await run('state.storyCampaign.completed.length===0'),'Unfinished battle cannot award progress');
            await run("RulesMatch.apply(rulesMatch,{type:'concede',player:2});saveRules();render();StoryMode.finish();save();true");
            check(await run("state.storyCampaign.phase==='after'&&state.storyCampaign.completed.length===1&&!state.storyCampaign.battle"),'Controlled opponent concession records one engine-confirmed mission win');await snapshot('progress');
           }else if(phase==='progress-restore'){
            await exact('progress');await run('StoryMode.continueCampaign();true');check(await run("state.storyCampaign.phase==='after'&&state.storyCampaign.completed.length===1"),'Won mission and after-dialogue retained');
            await run("for(let i=0;i<200&&state.storyCampaign.phase==='after';i++)StoryMode.next();save();true");check(await run("state.storyCampaign.phase==='brief'&&state.storyCampaign.mission===1&&state.storyCampaign.completed.length===1"),'After-dialogue advances once to next mission');await snapshot('next-mission');
           }else if(phase==='next-restore'){
            await exact('next-mission');await run('StoryMode.continueCampaign();true');check(await run('state.storyCampaign.completed.length===1&&state.storyCampaign.mission===1'),'Next mission persists without duplicate completion');
           }else if(phase==='exchange-save'){
            const sentinel=new Error('capture-mid-exchange');try{await require(path.join(root,'work/campaign-release/exchange-cases.cjs'))({run,reload:async()=>{await win.webContents.reload();for(let i=0;i<600;i++){if(await run('rulesReady'))break;await wait(100);}},viewport:async width=>{win.setContentSize(width,960);},screenshot:async()=>{},check:(v,n)=>{check(v,n);if(n==='Resume returns to exact Celebi reply')throw sentinel;}});}catch(e){if(e!==sentinel)throw e;}
            check(await run('StoryMode.battleTalkState().exchanges.queue[0].line===1'),'Boss exchange paused on Celebi reply');await run('save();true');await snapshot('exchange');
           }else if(phase==='exchange-restore'){
            await exact('exchange');await run('StoryMode.open();StoryMode.resume();stopBotForUndo();StoryMode.collapseBattleTalk(false);render();true');check(await run('StoryMode.battleTalkState().exchanges.queue[0].line===1'),'Boss reply cursor survives full process restart');check(await run('document.querySelector(".battle-story-line").textContent.includes("My thoughts matter")'),'Exact expanded Celebi reply returns');
            const journal=await run('JSON.stringify(rulesMatch.journal)');await run('StoryMode.advanceBossExchange();true');check(await run('JSON.stringify(rulesMatch.journal)')===journal,'Reading next reply does not change gameplay');
           }else throw Error('Unknown phase');
           fs.writeFileSync(path.join(dir,phase+'-result.json'),JSON.stringify({passed:true,phase,checks,isolatedProfile:true,controlledWinFixture:phase==='battle-restore',notStrategicPlaythrough:true},null,2));console.log('PASS',phase,checks);
          }};require(path.join(source,'main.cjs'));
          '@ | Set-Content -LiteralPath $entry -Encoding utf8
          $electron = node -e "console.log(require('electron'))" | Select-Object -Last 1
          $env:ELECTRON_RUN_AS_NODE = $null
          $source = (Get-Location).Path
          foreach ($phase in @('story-save','story-restore','battle-restore','progress-restore','next-restore','exchange-save','exchange-restore')) {
            $profile = if ($phase -like 'exchange-*') { "$env:RUNNER_TEMP/campaign-exchange-restart" } else { "$env:RUNNER_TEMP/campaign-progress-restart" }
            $process = Start-Process -FilePath $electron -ArgumentList @($entry,$source,$profile,$phase) -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/$phase-out.txt" -RedirectStandardError "$env:RUNNER_TEMP/$phase-error.txt"
            Get-Content "$env:RUNNER_TEMP/$phase-out.txt"
            if ($process.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP/$phase-error.txt"; Get-Content "$profile/failure.txt" -ErrorAction SilentlyContinue; throw "Campaign process phase failed: $phase" }
            $result = Get-Content "$profile/$phase-result.json" -Raw | ConvertFrom-Json
            if (!$result.passed) { throw 'Campaign restart result failed' }
            $result | ConvertTo-Json -Depth 8
          }

  source_archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify ZIP and sequential tar.gz source downloads
        shell: python
        run: |
          import urllib.request,zipfile,tarfile,io,json,hashlib
          tag='v3.2.0-build-2026-10-28';manifest='verification/source-manifest-3.2.0.json'
          url=f'https://github.com/KenGuyGames/ILEX.GG/archive/refs/tags/{tag}.zip'
          data=urllib.request.urlopen(url,timeout=300).read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              name=next(n for n in z.namelist() if n.endswith('/'+manifest));prefix=name[:-len(manifest)]
              raw=z.read(name);m=json.loads(raw);checked=set()
              for e in z.infolist():
                  n=e.filename[len(prefix):]
                  if n in m['files']:
                      assert hashlib.sha256(z.read(e)).hexdigest()==m['files'][n],n
                      checked.add(n)
              assert len(checked)==len(m['files'])
              print('PASS zip:',len(checked),'files match the release manifest',flush=True)
          del data
          url=f'https://github.com/KenGuyGames/ILEX.GG/archive/refs/tags/{tag}.tar.gz'
          checked=set();found=False
          with urllib.request.urlopen(url,timeout=300) as response,tarfile.open(fileobj=response,mode='r|gz') as z:
              for e in z:
                  if not e.isfile():continue
                  n=e.name.split('/',1)[1] if '/' in e.name else ''
                  if n==manifest:
                      assert z.extractfile(e).read()==raw;found=True
                  elif n in m['files']:
                      h=hashlib.sha256();f=z.extractfile(e)
                      while True:
                          b=f.read(1024*1024)
                          if not b:break
                          h.update(b)
                      assert h.hexdigest()==m['files'][n],n
                      assert n not in checked;checked.add(n)
          assert found and len(checked)==len(m['files'])
          print('PASS tar.gz:',len(checked),'files match the release manifest',flush=True)
