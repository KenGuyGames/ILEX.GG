name: Follow release README from fresh source
on:
  push:
    paths:
      - .github/workflows/test-release-1.12.0.yml
permissions:
  contents: read
jobs:
  readme:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh source ZIP from the release
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/KenGuyGames/ILEX.GG/archive/refs/tags/v1.12.0-build-2026-10-17.zip' -OutFile "$env:RUNNER_TEMP/source.zip"
          Expand-Archive "$env:RUNNER_TEMP/source.zip" "$env:RUNNER_TEMP/extracted"
          $download = Get-ChildItem "$env:RUNNER_TEMP/extracted" -Directory | Select-Object -First 1
          Move-Item -LiteralPath $download.FullName -Destination "$env:RUNNER_TEMP/source"
          node --version
          npm --version
          if (Test-Path "$env:RUNNER_TEMP/source/node_modules") { throw 'Download contains dependencies' }
          if (Test-Path "$env:RUNNER_TEMP/source/outputs/Pokemon-TCG-Lab/scans") { throw 'Download contains scans' }
          if (Test-Path "$env:APPDATA/TCG Lab") { throw 'Test profile is not fresh' }
      - name: README npm install
        working-directory: ${{ runner.temp }}/source
        run: npm install
      - name: First README npm start
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          $logPrefix = Join-Path $env:RUNNER_TEMP 'first-start'
          $launcher = Start-Process -FilePath $env:ComSpec -ArgumentList '/d /s /c "npm start"' -WorkingDirectory (Get-Location).Path -WindowStyle Hidden -PassThru -RedirectStandardOutput "$logPrefix-out.txt" -RedirectStandardError "$logPrefix-error.txt"
          $sourcePrefix = (Get-Location).Path
          $deadline = (Get-Date).AddSeconds(120)
          $window = $null
          while ((Get-Date) -lt $deadline) {
            $window = Get-Process electron -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$sourcePrefix*" -and $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -like '*ILEX.GG*' } | Select-Object -First 1
            if ($window) { break }
            if ($launcher.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (!$window) {
            Get-Content "$logPrefix-out.txt" -ErrorAction SilentlyContinue
            Get-Content "$logPrefix-error.txt" -ErrorAction SilentlyContinue
            throw 'npm start did not open the ILEX.GG window'
          }
          Start-Sleep -Seconds 12
          $window.Refresh()
          if ($window.HasExited) { throw 'The app exited during startup' }
          $cached = @(Get-ChildItem "$env:APPDATA/TCG Lab/card-cache" -Recurse -File -ErrorAction SilentlyContinue)
          Write-Output "PASS npm start: title=$($window.MainWindowTitle); responding=$($window.Responding); cacheFiles=$($cached.Count)"
          if (!$window.Responding) { throw 'App window is not responding' }
          if ($cached.Count -eq 0) { throw 'No artwork was cached from the fresh launch' }
          $null = $window.CloseMainWindow()
          if (!$launcher.WaitForExit(15000)) { throw 'npm start did not exit after closing the app' }
          Get-Content "$logPrefix-out.txt"
          $stderr = Get-Content "$logPrefix-error.txt" -Raw -ErrorAction SilentlyContinue
          if ($stderr -match 'Uncaught Exception|ReferenceError:|TypeError:') { throw $stderr }
          Write-Output "PASS normal window launch and close; npm exit $($launcher.ExitCode)"
          if ($launcher.ExitCode -ne 0) { throw 'npm start returned a nonzero exit code' }

      - name: README install locked build tools
        working-directory: ${{ runner.temp }}/source
        run: npm ci --prefix work/desktop-build
      - name: README rebuild engine
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          npm run build:rules
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $manifest = Get-Content verification/source-manifest-1.12.0.json -Raw | ConvertFrom-Json
          if ((Get-FileHash work/desktop/ui/rules-engine.js).Hash.ToLower() -ne $manifest.rulesEngineSha256) { throw 'Rebuilt engine hash mismatch' }
      - name: Rebuilt README npm start
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          $logPrefix = Join-Path $env:RUNNER_TEMP 'rebuilt-start'
          $launcher = Start-Process -FilePath $env:ComSpec -ArgumentList '/d /s /c "npm start"' -WorkingDirectory (Get-Location).Path -WindowStyle Hidden -PassThru -RedirectStandardOutput "$logPrefix-out.txt" -RedirectStandardError "$logPrefix-error.txt"
          $sourcePrefix = (Get-Location).Path
          $deadline = (Get-Date).AddSeconds(120)
          $window = $null
          while ((Get-Date) -lt $deadline) {
            $window = Get-Process electron -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$sourcePrefix*" -and $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -like '*ILEX.GG*' } | Select-Object -First 1
            if ($window) { break }
            if ($launcher.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (!$window) {
            Get-Content "$logPrefix-out.txt" -ErrorAction SilentlyContinue
            Get-Content "$logPrefix-error.txt" -ErrorAction SilentlyContinue
            throw 'npm start did not open the ILEX.GG window'
          }
          Start-Sleep -Seconds 12
          $window.Refresh()
          if ($window.HasExited) { throw 'The app exited during startup' }
          $cached = @(Get-ChildItem "$env:APPDATA/TCG Lab/card-cache" -Recurse -File -ErrorAction SilentlyContinue)
          Write-Output "PASS npm start: title=$($window.MainWindowTitle); responding=$($window.Responding); cacheFiles=$($cached.Count)"
          if (!$window.Responding) { throw 'App window is not responding' }
          if ($cached.Count -eq 0) { throw 'No artwork was cached from the fresh launch' }
          $null = $window.CloseMainWindow()
          if (!$launcher.WaitForExit(15000)) { throw 'npm start did not exit after closing the app' }
          Get-Content "$logPrefix-out.txt"
          $stderr = Get-Content "$logPrefix-error.txt" -Raw -ErrorAction SilentlyContinue
          if ($stderr -match 'Uncaught Exception|ReferenceError:|TypeError:') { throw $stderr }
          Write-Output "PASS normal window launch and close; npm exit $($launcher.ExitCode)"
          if ($launcher.ExitCode -ne 0) { throw 'npm start returned a nonzero exit code' }

      - name: README test commands in order
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          npm run test:rules
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:ex
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:dp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:hgss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:bw
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:bot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node work/desktop-build/card-cache-tests.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Write isolated runtime smoke test
        shell: pwsh
        run: |
          @'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const source=path.join(__dirname,'source/work/desktop'),report=path.join(__dirname,'runtime-smoke');fs.mkdirSync(report,{recursive:true});
          process.argv.push('--self-test',report);
          const self=path.join(source,'self-test.cjs');
          require.cache[self]={id:self,filename:self,loaded:true,exports:async(win)=>{
           const ev=s=>win.webContents.executeJavaScript(s,true); const delay=ms=>new Promise(r=>setTimeout(r,ms));
           const errors=[];win.webContents.on('console-message',(_e,_l,message)=>{if(/Uncaught|ReferenceError|TypeError/.test(message||''))errors.push(message)});
           for(let i=0;i<300;i++){if(await ev("typeof rulesReady!=='undefined'&&rulesReady&&cards.length>23000"))break;await delay(100)}
           const status=await ev(`(async()=>({ready:rulesReady,cards:cards.length,title:document.title,version:'1.12.0',wotc:await fetch('wotc-coverage.json').then(r=>r.json()),ex:await fetch('ex-coverage.json').then(r=>r.json()),dp:await fetch('dp-coverage.json').then(r=>r.json()),hgss:await fetch('hgss-coverage.json').then(r=>r.json()),bw:await fetch('bw-coverage.json').then(r=>r.json())}))()`);
           assert(status.ready);assert.equal(status.wotc.available,1793);assert.equal(status.ex.available,1857);assert.equal(status.ex.pending,0);assert.equal(status.dp.available,1558);assert.equal(status.dp.pending,0);assert.equal(status.hgss.available,605);assert.equal(status.hgss.pending,0);assert.equal(status.bw.available,1521);assert.equal(status.bw.pending,0);
           const home=await ev(`({tab,prime:document.querySelector('#menu-celebi').dataset.cardId,count:document.querySelectorAll('nav button').length})`);assert.equal(home.tab,'home');assert.equal(home.prime,'hgss4-92');assert.equal(home.count,6);
           const screens=[];
           for(const tab of ['library','decks','play','formats','custom','packs']){
             const text=await ev(`document.querySelector('nav button[data-tab="${tab}"]').click(); document.querySelector('#app').innerText`);
             assert(text.length>20,tab+' did not render');screens.push({tab,rendered:true});
           }
           await ev("document.querySelector('nav button[data-tab=library]').click()");
           await delay(3000);
           const artwork=await ev("Array.from(document.querySelectorAll('#app img')).map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0}))");
           fs.writeFileSync(path.join(report,'menu.png'),(await win.webContents.capturePage()).toPNG());
           const native=await ev(fs.readFileSync(path.join(source,'ex-native-tests.js'),'utf8'));
           assert(native.passed,'EX native checks failed');
           const dpNative=await ev(fs.readFileSync(path.join(source,'dp-native-tests.js'),'utf8'));
           assert(dpNative.passed,'DP native checks failed');
           const hgssNative=await ev(fs.readFileSync(path.join(source,'hgss-native-tests.js'),'utf8'));assert(hgssNative.passed,'HGSS native checks failed');
           const bwNative=await ev(fs.readFileSync(path.join(source,'bw-native-tests.js'),'utf8'));assert(bwNative.passed,'BW native checks failed');
           assert.equal(errors.length,0,JSON.stringify(errors));
           fs.writeFileSync(path.join(report,'report.json'),JSON.stringify({passed:true,ready:status.ready,cards:status.cards,wotc:status.wotc.available,ex:status.ex.available,dp:status.dp.available,hgss:status.hgss.available,bw:status.bw.available,dpNative,hgssNative,bwNative,home,screens,artwork,native,errors},null,2));
           console.log('PASS fresh-source Electron startup, six screens, forest home, and EX/DP/HGSS/BW native interaction/replay/Undo checks.');
          }};
          require(path.join(source,'main.cjs'));
          '@ | Set-Content "$env:RUNNER_TEMP/smoke.cjs" -Encoding utf8
      - name: Launch app and test native interactions
        working-directory: ${{ runner.temp }}/source
        shell: pwsh
        run: |
          $electron = node -e "console.log(require('electron'))" | Select-Object -Last 1
          $env:ELECTRON_RUN_AS_NODE = $null
          $process = Start-Process -FilePath $electron -ArgumentList @("$env:RUNNER_TEMP/smoke.cjs",'--enable-logging=stderr') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/electron-out.txt" -RedirectStandardError "$env:RUNNER_TEMP/electron-error.txt"
          Get-Content "$env:RUNNER_TEMP/electron-out.txt"
          Get-Content "$env:RUNNER_TEMP/electron-error.txt"
          if (Test-Path "$env:RUNNER_TEMP/runtime-smoke/failure.txt") { Get-Content "$env:RUNNER_TEMP/runtime-smoke/failure.txt" }
          if ($process.ExitCode -ne 0) { throw "Electron exit $($process.ExitCode)" }
          $report = Get-Content "$env:RUNNER_TEMP/runtime-smoke/report.json" -Raw | ConvertFrom-Json
          if (!$report.passed) { throw 'Runtime smoke test failed' }
          $report | ConvertTo-Json -Depth 8


