name: Sync verified ILEX.GG 1.6.0 source
on:
  push:
    paths:
      - .github/workflows/sync-source-1.6.0.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and unpack source
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json, subprocess
          root = Path.cwd().resolve()
          archives = {
            "ILEX.GG-source-1.6.0-app.zip": "2f3b8128e8ed16fa52c1486db05e739c8ad04e1b4704f972664323c4be7014eb",
            "ILEX.GG-source-1.6.0-music.zip": "5de8ace36841bed2ffd0b60e9496075415f1190533c56200a7f0de3938231211",
            "ILEX.GG-source-1.6.0-engine.zip": "b7f93f9f4a6f79170ff104672761a6c76f907ef26e303585b942106f4d45cd73",
            "ILEX.GG-source-1.6.0-tools-data.zip": "cc8830073c2441020540c1713a63dac23852fb8c1465cf7b6ae66ee1a3bd1f4f",
          }
          for name, expected in archives.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
              with ZipFile(name) as archive:
                  for member in archive.infolist():
                      target = (root / member.filename).resolve()
                      assert target.is_relative_to(root) and ".git" not in target.relative_to(root).parts
                  archive.extractall(root)
          manifest = json.loads(Path("verification/source-manifest-1.6.0.json").read_text())
          files = manifest["files"]
          managed = ("work/desktop/", "work/desktop-build/", "work/rules-research/twinleafgg-main/ptcg-server/", "work/card-sources/pokemon-tcg-data-master/")
          for name in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0"):
              if name and name.startswith(managed) and name not in files:
                  Path(name).unlink(missing_ok=True)
          for name in Path("work/rules-research").glob("wotc-pending-*.txt"):
              if name.as_posix() not in files:
                  name.unlink()
          for name, expected in files.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          assert json.loads(Path("work/desktop/package.json").read_text())["version"] == "1.6.0"
          for era, count in [("wotc",1793),("ex",1857),("dp",1558)]:
              c = json.loads(Path(f"work/desktop/ui/{era}-coverage.json").read_text())
              assert c["available"] == count and c["pending"] == 0
          print(f"Verified {len(files)} source files against the release snapshot.")
      - name: Install locked build tools
        run: npm ci --prefix work/desktop-build
      - name: Rebuild release rules engine
        run: npm run build:rules
      - name: Verify rebuilt engine and source
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          m = json.loads(Path("verification/source-manifest-1.6.0.json").read_text())
          for name, expected in m["files"].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          print("Rebuilt engine and all source files match verified ILEX.GG 1.6.0.")
      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git rm --ignore-unmatch ILEX.GG-source.zip ILEX.GG-source-1.6.0-*.zip
          git rm .github/workflows/sync-source-1.6.0.yml
          git add -A
          git commit -m "Synchronize source with verified ILEX.GG 1.6.0 complete WOTC, EX and DP/Platinum release"
          git push origin HEAD:main

          git tag v1.6.0-build-2026-10-14
          git push origin v1.6.0-build-2026-10-14
