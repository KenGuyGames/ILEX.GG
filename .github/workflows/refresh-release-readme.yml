name: Refresh 1.5.0 release README
on:
  push:
    paths:
      - .github/workflows/refresh-release-readme.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify app source is unchanged and refresh README hash
        shell: python
        run: |
          import subprocess,hashlib,json
          from pathlib import Path
          subprocess.run(["git","diff","--exit-code","8baf028b263d4ee6b2aa51e528b9dca8e5c59baf","HEAD","--","work","package.json"],check=True)
          p=Path("verification/source-manifest-1.5.0.json")
          m=json.loads(p.read_text())
          m["files"]["README.md"]=hashlib.sha256(Path("README.md").read_bytes()).hexdigest()
          p.write_text(json.dumps(m,indent=2)+"\n")
      - name: Publish README in release source downloads
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-release-readme.yml
          git add verification/source-manifest-1.5.0.json
          git commit -m "Refresh release-source README verification hash"
          git push origin HEAD:main
          ref=refs/tags/v1.5.0-build-2026-10-14
          old=$(git ls-remote origin "$ref" | cut -f1)
          test "$old" = "8baf028b263d4ee6b2aa51e528b9dca8e5c59baf"
          git tag -f v1.5.0-build-2026-10-14 HEAD
          git push --force-with-lease="$ref:$old" origin "$ref"
