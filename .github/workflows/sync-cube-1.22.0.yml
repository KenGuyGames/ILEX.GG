name: Sync verified Cube Drafting 1.22.0 source
on:
  push:
    paths:
      - .github/workflows/sync-cube-1.22.0.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and synchronize frozen Cube Drafting source
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json,subprocess
          root=Path.cwd().resolve()
          archives={
            "ILEX.GG-source-1.22.0-part1.zip": "b36f80c93667ac14037f98cd4bd161bd706296a762a96d7853a52e3ae55088c3",
            "ILEX.GG-source-1.22.0-part2.zip": "cfe78ff5fb1c1e655d377ebc29afb5c3224626e105a5b79ca6c564aa5d417753",
            "ILEX.GG-source-1.22.0-part3.zip": "9c7010ec255b9a5dbd0ebf6d5979ca3efea6538359be759b2ff0d0f49c8318ae",
            "ILEX.GG-source-1.22.0-part4.zip": "6651134aadc68096f8b292af452777feef569010b99c151654d240b29c2bbcfc",
          }
          for name,expected in archives.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
              with ZipFile(name) as z:
                  for e in z.infolist():
                      p=(root/e.filename).resolve()
                      assert p.is_relative_to(root) and '.git' not in p.relative_to(root).parts
                  z.extractall(root)
          m=json.loads(Path('verification/source-manifest-1.22.0.json').read_text());files=m['files']
          managed=('work/desktop/','work/desktop-build/','work/cube-source/','work/mega-source/','work/android-build/','docs/screenshots/','verification/')
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if name and name.startswith(managed) and name not in files:Path(name).unlink(missing_ok=True)
          for name,h in files.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          assert json.loads(Path('work/desktop/package.json').read_text())['version']=='1.22.0'
          print(f'Verified {len(files)} source files')
      - name: Install locked build tools
        run: npm ci --prefix work/desktop-build
      - name: Rebuild canonical current engine
        run: npm run build:rules
      - name: Verify reproducible source and stage source archives
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess
          m=json.loads(Path('verification/source-manifest-1.22.0.json').read_text())
          for name,h in m['files'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          for name in m['files']:
              if name.endswith('.zip'):subprocess.run(['git','add','-f','--',name],check=True)
          print('All frozen files and rebuilt engine match')
      - name: Commit source and create new release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git rm --ignore-unmatch ILEX.GG-source-1.22.0-part*.zip
          git rm .github/workflows/sync-cube-1.22.0.yml
          git add -A
          git commit -m "Release ILEX.GG 1.22.0 Cube Drafting source, current fixes and README"
          git push origin HEAD:main
          test -z "$(git ls-remote origin refs/tags/v1.22.0-build-2026-10-20)"
          git tag v1.22.0-build-2026-10-20
          git push origin refs/tags/v1.22.0-build-2026-10-20

